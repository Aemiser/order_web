name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时刻只允许一个发布在跑；不取消进行中的任务，避免部署到一半被中断
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'
  APP_DIR: /opt/order_web
  STAGING_DIR: /opt/order_web_staging

permissions:
  contents: read

jobs:
  verify:
    name: 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 前端类型检查
        working-directory: web
        run: |
          npm ci
          npm run lint

  build:
    name: 构建
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 交叉编译 Linux 二进制
        run: |
          mkdir -p bundle/config
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o bundle/server .

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 组装部署包
        run: |
          # 仅打包静态配置；settings.yaml 与 productbelong.json 属服务器本地资产，不参与发布
          cp go/config/aimap.json go/config/systemPrompt.txt go/config/systemPromptWuyin.txt bundle/config/
          tar -czf bundle/web.tgz -C web/dist .
          tar -czf bundle.tgz -C bundle .
          ls -la bundle.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: bundle.tgz
          retention-days: 5
          if-no-files-found: error

  deploy:
    name: 部署到生产
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # 密钥一律经 env 传递，不用 ${{ secrets.* }} 直接内插进 shell：
    # 内插发生在 shell 解析之前，密钥里若含引号或 $ 会被当作语法执行。
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_PORT: ${{ secrets.ECS_PORT }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
      APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: 上传部署包与脚本
        run: |
          # StrictHostKeyChecking=yes 让固定 known_hosts 真正生效，主机密钥不符即拒绝连接；
          # BatchMode=yes 避免凭据缺失时卡在密码交互上直到超时。
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes"
          DEST="$ECS_USER@$ECS_HOST"
          ssh $SSH_OPTS -p "$ECS_PORT" "$DEST" "mkdir -p $STAGING_DIR"
          scp $SSH_OPTS -P "$ECS_PORT" bundle.tgz "$DEST:$STAGING_DIR/bundle.tgz"
          scp $SSH_OPTS -P "$ECS_PORT" scripts/remote_deploy.sh "$DEST:$STAGING_DIR/remote_deploy.sh"

      - name: 执行远程部署
        run: |
          ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -p "$ECS_PORT" "$ECS_USER@$ECS_HOST" \
            "bash $STAGING_DIR/remote_deploy.sh $STAGING_DIR/bundle.tgz"

      - name: 公网冒烟测试
        run: |
          curl -fsS -m 20 "$APP_HEALTH_URL"
          echo
          curl -fsS -m 20 -o /dev/null -w "前端 HTTP %{http_code}\n" "$APP_BASE_URL"

      - name: 清理 SSH 凭据
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
