# 配置模板：复制本文件为同目录下的 settings.yaml 并填入真实值。
# settings.yaml 含数据库密码、SMTP 授权码与 AI apikey 等敏感信息，已被 .gitignore 忽略，严禁提交入库。
log:
    level: debug
    app: order_server
    dir: logs
db:
    - host: <数据库主机地址>
      port: 3306
      user: <数据库用户名>
      password: <数据库密码>
      dbname: <数据库名>
      debug: false
      maxIdleConns: 10
      maxOpenConns: 100
email:
    domain: <SMTP服务器域名>
    port: 587
    sendEmail: <发件邮箱地址>
    AuthCode: <SMTP授权码>
    sendNickname: <发件昵称>
    SSL: false
    TLS: false
savePath:
    excel: ./uploads
    json: ./uploads
aimodel:
    deepseek:
        apikey: <DeepSeek平台APIKey>
        apiUrl:
        timeout: 600
        modelname:
    qwen:
        apikey: <阿里云DashScope平台APIKey>
        apiUrl:
        timeout: 600
        modelname:
server:
    port: 8080
    allowOrigins:
        - "http://localhost:3000"
